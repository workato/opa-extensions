# ---------------------------------------------------------------------------
# Single source of truth for the artifact version this workspace publishes.
#
#   baseVersion      — the "marketing" version. The effective Gradle version
#                      derived at build time is either:
#                        * `${baseVersion}`                          (release,  when -Prelease is set)
#                        * `${baseVersion}-SNAPSHOT`                 (on master / main)
#                        * `${baseVersion}-${sanitized-branch}-SNAPSHOT`
#                                                                    (on any other branch)
#                      Root build.gradle performs the computation and applies
#                      the resolved version to every subproject.
#
# Nexus credentials (NOT stored here):
#   Put `nexusUsername` / `nexusPassword` into ~/.gradle/gradle.properties, or
#   pass as -PnexusUsername=... -PnexusPassword=..., or export
#   ORG_GRADLE_PROJECT_nexusUsername / ORG_GRADLE_PROJECT_nexusPassword as env
#   variables in CI. Missing credentials only matter if you run `publish` —
#   local builds and `publishToMavenLocal` work without them.
# ---------------------------------------------------------------------------
baseVersion=0.1.0
