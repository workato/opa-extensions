# ---------------------------------------------------------------------------
# Single source of truth for the artifact version this workspace publishes.
#
#   version          — the "marketing" version. Gradle picks this up as
#                      rootProject.version automatically. Override with
#                      `-Pversion=...` on the CLI if you really need a
#                      different base, though the normal workflow is to bump
#                      this line in a commit.
#
#   version.suffix   — NOT declared here on purpose. It is the lever that
#                      flips a build between release and SNAPSHOT:
#
#                        -Pversion.suffix=SNAPSHOT            → 0.1.0-SNAPSHOT
#                        -Pversion.suffix=feature-x-SNAPSHOT  → 0.1.0-feature-x-SNAPSHOT
#                        -Pversion.suffix=                    → 0.1.0 (explicit release)
#                        (property not passed at all)         → local git auto-detect
#                                                               (dev-laptop convenience; see
#                                                               root build.gradle for the exact
#                                                               branch → suffix rules)
#
#                      CI always passes -Pversion.suffix= explicitly
#                      (computed in ci.yml from GITHUB_REF_NAME + the
#                      `release` dispatch input), so the auto-detect path only
#                      fires on developer laptops.
#
# GitHub Packages credentials (NOT stored here):
#   Primary path in CI is the auto-provided GITHUB_ACTOR + GITHUB_TOKEN
#   (plus `permissions: packages: write` on the workflow), injected as
#   ORG_GRADLE_PROJECT_githubActor / ORG_GRADLE_PROJECT_githubToken.
#   For local ad-hoc publishing, generate a classic PAT with scope
#   `write:packages` (publish) or `read:packages` (consume) at
#   https://github.com/settings/tokens, then put
#     githubActor=<your-github-login>
#     githubToken=<pat>
#   into ~/.gradle/gradle.properties or pass via -P flags. Missing
#   credentials only matter if you run `publish`; local builds and
#   `publishToMavenLocal` work without them.
# ---------------------------------------------------------------------------
version=0.1.0
