plugins {
    id 'java-library'
}

java {
    withJavadocJar()
    withSourcesJar()
}

jar {
    from(projectDir) {
        include 'README.md'
    }
}

tasks.named('javadocJar') {
    from(projectDir) {
        include 'README.md'
    }
}

javadoc {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.encoding = 'UTF-8'
    options.overview = 'src/main/javadoc/overview.html'
    // Register the standard JDK Javadoc "@apiNote / @implSpec / @implNote" tags — modern JDKs
    // ship them in javadoc.tool but do not auto-register them in the Gradle default toolchain,
    // so a plain Javadoc run fails with "unknown tag". These placements mirror the standard
    // location Javadoc uses for the three tags.
    options.tags = [
            'apiNote:a:API Note:',
            'implSpec:a:Implementation Requirements:',
            'implNote:a:Implementation Note:'
    ]
}

dependencies {
    // All dependency versions are pinned by the workato-agent-bom at
    // libs/com/workato/agent/workato-agent-bom/0.1.0/workato-agent-bom-0.1.0.pom.
    // Declare GAV without versions — the BOM supplies them.
    api platform('com.workato.agent:workato-agent-bom:0.1.0')
    testImplementation platform('com.workato.agent:workato-agent-bom:0.1.0')

    // The public V1 API customers compile against — the only "agent-side" dep of this harness.
    api project(':workato-agent-extension-api')

    // Spring MVC + MockMvc provide the "mini agent" runtime the harness builds for each test.
    api 'org.springframework:spring-webmvc'
    api 'org.springframework:spring-test'

    // MockMvc internally calls jakarta.servlet.* types — exposed via MvcResult.getResponse() to
    // customers writing assertions on the raw response.
    api 'jakarta.servlet:jakarta.servlet-api'

    // Jackson 3 — default message converter in Spring MVC. Public types in the harness expose
    // ObjectMapper via FakeAgentExtension.getTools() and WebhookResponse.as(Class, ObjectMapper),
    // so the dependency has to be `api`.
    api 'tools.jackson.core:jackson-databind'

    // YAML support — the harness reads an extension's YAML section the same way the agent does.
    // Internal implementation detail of `.yaml(resource)` — no public type returns a YAML-specific
    // Jackson class, so `implementation` keeps it off customers' compile classpath.
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'

    // JUnit 5 is a required api dependency because the harness exposes a JUnit 5
    // BeforeAllCallback/AfterAllCallback for the @RegisterExtension integration path.
    api 'org.junit.jupiter:junit-jupiter-api'

    api 'org.slf4j:slf4j-api'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Publication — the test harness library.
//
// Same shape as the -api module: main jar + sources + javadoc, wired from the
// `java` software component. GitHub Packages repository and credentials come
// from the workspace-wide publishing block in root build.gradle.
// ---------------------------------------------------------------------------
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Workato Agent Extensions Test Harness'
                description = 'MockMvc-based test harness for Workato on-prem agent (OPA) extensions.'
                url = 'https://github.com/workato/opa-extensions'
            }
        }
    }
}
