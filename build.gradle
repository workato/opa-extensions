// Root project — only shared configuration. Every module
// (workato-agent-extension-api, workato-agent-extension-test,
// workato-agent-extension-demo) lives in its own subdirectory with its own
// build.gradle. This file sets Java version, repositories, and nothing else
// about dependency versions — every pin lives in the BOM authored at
// `libs/workato-agent-bom-0.1.0.xml`; settings.gradle materialises it into
// `build/bom-repo/` in Maven-repo layout, and modules import it via
// `platform('com.workato.agent:workato-agent-bom:0.1.0')`.

allprojects {
    group = 'com.workato.agent'
    version = '0.1.0'

    repositories {
        // Local Maven-layout repo that serves the workato-agent-bom. Populated by
        // settings.gradle at init time from libs/workato-agent-bom-0.1.0.xml.
        maven {
            url = rootProject.file('build/bom-repo').toURI()
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = 21
        targetCompatibility = 21
        // Make Gradle enforce the compiler JDK, not just the bytecode target. On a developer
        // laptop with a default JDK newer than 21 (25, 26, …) the setCompatibility pair above
        // would silently let the build run under a newer compiler against the older bytecode
        // level — fine in most cases, surprising when it isn't. CI already pins JDK 21
        // explicitly; this line gives local builds the same guarantee.
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
            showStandardStreams = false
        }
    }

    // ---------------------------------------------------------------------------------------
    // Dependency locking — pin the full transitive graph per subproject so the resolved
    // versions are reproducible across builds and visible in review (closes
    // boostsecurity-io-ai "CI/CD - Missing Lockfile" finding on every build.gradle).
    //
    // The BOM already pins direct versions; locking adds cryptographic pinning for the
    // transitive closure Gradle walks on top of that. Regenerate the lockfiles after any
    // BOM bump or dependency add/remove:
    //
    //   ./gradlew resolveAndLockAll --write-locks
    //
    // The `resolveAndLockAll` task below resolves every lockable configuration in one shot so
    // one invocation refreshes all lockfiles under src/… and build.gradle for every module.
    // ---------------------------------------------------------------------------------------
    dependencyLocking {
        lockAllConfigurations()
    }

    tasks.register('resolveAndLockAll') {
        group = 'help'
        description = 'Resolves every lockable configuration so `--write-locks` rewrites gradle.lockfile end-to-end.'
        notCompatibleWithConfigurationCache(
                'Resolves configurations at execution time to force lock file refresh — required for --write-locks.')
        doFirst {
            assert gradle.startParameter.writeDependencyLocks:
                    'Run with --write-locks, e.g. `./gradlew resolveAndLockAll --write-locks`.'
        }
        doLast {
            configurations.findAll { it.canBeResolved }.each { it.resolve() }
        }
    }
}
