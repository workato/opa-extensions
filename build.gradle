// Root project — only shared configuration. Every module
// (workato-agent-extension-api, workato-agent-extension-test,
// workato-agent-extension-demo) lives in its own subdirectory with its own
// build.gradle; this file sets Java version, repositories, and the shared
// version constants every module reads from `project.ext`.

allprojects {
    group = 'com.workato.agent'
    version = '0.1.0'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = 21
        targetCompatibility = 21
    }

    // Shared dependency versions. Mirrors OPA's version-catalog pins so the
    // runtime behaviour here matches the agent's exactly. Keep them here (not
    // duplicated per module) so a bump stays local to this file.
    ext {
        springVersion = '7.0.9'
        slf4jVersion = '2.0.18'
        logbackVersion = '1.5.38'
        jacksonVersion = '3.2.2'
        jakartaServletVersion = '6.1.0'
        junitVersion = '6.1.3'
        junitPlatformVersion = '6.1.3'
        assertjVersion = '3.27.7'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
            showStandardStreams = false
        }
    }
}
