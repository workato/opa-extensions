rootProject.name = 'workato-agent-extension'

include 'workato-agent-extension-api'
include 'workato-agent-extension-test'
include 'workato-agent-extension-demo'

// ---------------------------------------------------------------------------
// Dependency-version management via `libs/workato-onprem-bom-0.1.0.xml`.
//
// The curated BOM source lives at `libs/workato-onprem-bom-0.1.0.xml` (plain
// Maven-style <dependencyManagement> POM). To let Gradle consume it via
// `platform('com.workato.agent:workato-agent-bom:0.1.0')`, we materialise it
// into Maven-repo layout under `build/bom-repo/` here, before any module
// build.gradle evaluates, and the root build.gradle exposes `build/bom-repo/`
// as a maven { } repository. The `build/` tree is gitignored, so only the
// curated source .xml ends up in version control.
//
// Two transformations happen on the way:
//   1. GAV substitution — the source POM was published by Gradle without
//      coordinates (empty <groupId>, "unspecified" <version>), so we rewrite
//      them to the deployment coords.
//   2. Versionless-import stripping — Gradle 9 silently rejects any BOM that
//      contains a <dependency> with <scope>import</scope> but no <version>
//      (3 such entries exist in the source: grpc-bom, protobuf-bom, guava-bom).
//      Those would be fine in Maven inheriting from a parent POM, but this
//      standalone BOM has no parent, so we drop them. No module in this
//      workspace depends on grpc/protobuf/guava, so the loss is harmless.
//
// The transformation uses a real XML DOM instead of line regexes:
//   * handles <dependency> on a single line, with attributes, with unusual
//     whitespace, etc. — all forms a formatter might produce;
//   * does not confuse a stray `<version>` string inside a comment with a
//     real <version> element;
//   * unaffected by future indentation changes to the source .xml.
// ---------------------------------------------------------------------------
import groovy.xml.XmlParser
import groovy.xml.XmlUtil

def bomSource = file('libs/workato-onprem-bom-0.1.0.xml')
def bomTarget = file('build/bom-repo/com/workato/agent/workato-agent-bom/0.1.0/workato-agent-bom-0.1.0.pom')
if (!bomSource.isFile()) {
    throw new GradleException("BOM source not found: ${bomSource}. See CLAUDE.md § Dependency management.")
}
if (!bomTarget.isFile() || bomTarget.lastModified() < bomSource.lastModified()) {
    bomTarget.parentFile.mkdirs()

    // Namespace-oblivious parsing — we only care about element local names, and the Maven POM
    // namespace is uniform across the whole file. This keeps the matching below plain-string.
    def parser = new XmlParser(false, false, true)
    parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
    def root = parser.parse(bomSource)

    // 1. GAV rewrite — only the project-level coords (direct children of <project>).
    def setOrAddChild = { parent, String local, String value ->
        def matches = parent.children().findAll { it instanceof groovy.util.Node && it.name() == local }
        if (matches.isEmpty()) {
            parent.appendNode(local, value)
        } else {
            matches[0].setValue(value)
        }
    }
    setOrAddChild(root, 'groupId', 'com.workato.agent')
    setOrAddChild(root, 'artifactId', 'workato-agent-bom')
    setOrAddChild(root, 'version', '0.1.0')

    // 2. Drop versionless imports — Gradle 9 rejects the POM wholesale otherwise.
    def deps = root.'**'.findAll { it instanceof groovy.util.Node && it.name() == 'dependency' }
    deps.each { dep ->
        boolean hasVersion = dep.children().any {
            it instanceof groovy.util.Node && it.name() == 'version'
        }
        if (!hasVersion) {
            dep.parent().remove(dep)
        }
    }

    bomTarget.setText(XmlUtil.serialize(root), 'UTF-8')
    logger.lifecycle("Regenerated ${bomTarget.name} from ${bomSource.name}")
}
